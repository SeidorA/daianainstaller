# Local provisioning validation only; do not use this override for published images.
# Build both images from the corresponding daiananext and daianastudio worktrees first.
services:
  daiananext:
    image: daiana-local:studio-provision
    pull_policy: never
    environment:
      NEXT_PUBLIC_API_PYTHON: http://daianapython:5002

  daianastudio:
    image: daianastudio-local:account-provision
    pull_policy: never

  daianapython:
    image: daianapython-local:dashboard-analytics
    pull_policy: never
    environment:
      DB_USER: supabase_admin
      DB_PASS: ${POSTGRES_PASSWORD}
