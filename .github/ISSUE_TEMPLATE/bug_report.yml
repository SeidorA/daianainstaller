name: Bug report
description: Report a reproducible problem in the installer or deployment tooling
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and the expected behavior.
      placeholder: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the relevant steps and configuration without secrets.
      placeholder: |
        1. Set ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Installer version
      description: Provide the VERSION value or commit used.
      placeholder: 0.4.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Development
        - Local
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant logs with secrets and credentials removed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, credentials, and private data from this report.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
